name: Daily Impact Report

on:
  schedule:
    # 07:23 Bangkok (00:23 UTC). Off the top of the hour, when GitHub delays or drops
    # the most scheduled runs; this repo's 01:00 UTC runs often started hours late.
    - cron: '23 0 * * *'
  workflow_dispatch:      # manual trigger for testing

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install google-genai pytz feedparser requests beautifulsoup4

      - name: Generate report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}    # optional override; empty = script default
          READING_MODEL: ${{ vars.READING_MODEL }}  # optional; empty = gemini-flash-latest
        run: python generate_report.py

      - name: Publish to GitHub Pages
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add .
          git diff --staged --quiet || git commit -m "Daily Impact: $(TZ='Asia/Bangkok' date +'%d %b %Y')"
          git pull --rebase
          git push
