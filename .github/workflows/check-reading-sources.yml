name: Check reading sources (temporary)

on:
  push:
    branches: [claude/beautiful-ptolemy-20brhn]
    paths: [tools/candidate_sources.json, .github/workflows/check-reading-sources.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser requests beautifulsoup4
      - run: python tools/check_reading_sources.py tools/candidate_sources.json
